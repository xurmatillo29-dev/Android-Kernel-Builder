name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Kernel Source
        run: |
          mkdir kernel
          curl -L https://github.com | tar -xz -C kernel --strip-components=1

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz patchi muvaffaqiyatli bajarildi."
          else
            echo "GPU dtsi fayli topilmadi!"
          fi

      - name: Set up Clang and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev clang lld bison flex
          # Zamonaviy kerneellar uchun LLVM muhitini global sozlash
          sudo ln -sf /usr/bin/clang /usr/bin/clang-14

      - name: Build Kernel Image
        run: |
          cd kernel
          # Agar defconfig fayli topilmasa, mos keladiganini avtomatik qidiradi
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out vendor/sm7325_defconfig
          elif [ -f "arch/arm64/configs/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out taoyao_defconfig
          else
            make ARCH=arm64 O=out sm7325_defconfig
          fi
          
          # Kompilyatsiyani boshlash
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
