name: PhantomK12 NetHunter Kernel Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Compiling via Phantom-Core
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "KERNEL_SRC=https://github.com/LineageOS/android_kernel_xiaomi_sm8350" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=lineage-21" >> $GITHUB_ENV
          echo "DEFCONFIG=taoyao_defconfig" >> $GITHUB_ENV

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils wget curl git cpio flex bison libelf-dev lz4 tar zip python3

      - name: Download Google AOSP Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          # TO'G'RILANGAN TO'G'RIDAN-TO'G'RI ARXIV HAVOLASI
          wget https://googlesource.com
          tar -xf clang-r522817.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Fetch Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SRC }} $GITHUB_WORKSPACE/source

      - name: Apply Kali NetHunter Patches
        run: |
          cd $GITHUB_WORKSPACE/source
          git clone --depth=1 https://gitlab.com nh_patcher
          python3 nh_patcher/patches/patch.py -k . -a arm64

      - name: Configure Defconfig (Enable Wi-Fi Skaner & HID)
        run: |
          cd $GITHUB_WORKSPACE/source
          export ARCH=arm64
          make ${{ env.DEFCONFIG }}
          
          # NetHunter drayverlarini va RT5370 chipini majburan yoqish
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_RT2X00
          ./scripts/config --enable CONFIG_RT2800USB
          ./scripts/config --enable CONFIG_RT2800USB_RT53XX
          ./scripts/config --enable CONFIG_USB_GADGET
          ./scripts/config --enable CONFIG_USB_F_HID
          ./scripts/config --enable CONFIG_USB_CONFIGFS_F_HID
          
          make savedefconfig

      - name: Compile Kernel via Phantom-Engine
        run: |
          cd $GITHUB_WORKSPACE/source
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          make -j$(nproc --all) Image.gz

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com AnyKernel
          cp source/arch/arm64/boot/Image.gz AnyKernel/
          sed -i 's/device.name1=/device.name1=taoyao/g' AnyKernel/anykernel.sh
          cd AnyKernel
          zip -r ../Phantom-NetHunter-Taoyao.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomK12-NetHunter-Kernel
          path: Phantom-NetHunter-Taoyao.zip
