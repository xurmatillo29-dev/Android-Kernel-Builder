name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Standard Dependencies and Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Set up Clang and Toolchain
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64

      - name: Download Verified AtomX Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Atom-X-Devs/android_kernel_xiaomi_sm7325
          ref: kernel.lnx.5.4.r1-rel
          path: kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          else
            ALT_GPU=$(find . -name "*gpu*.dtsi" | head -n 1)
            if [ -n "$ALT_GPU" ]; then
              sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' "$ALT_GPU"
              echo "Muqobil GPU fayli patch qilindi!"
            fi
          fi

      - name: Build Verified Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Konfiguratsiya faylini generatsiya qilish
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- vendor/sm7325_defconfig
          else
            make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          fi
          
          # Qualcomm 5.4 kerneellari uchun eng to'g'ri 'Image.gz-dtb' formatini faollashtirib build qilamiz
          make ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j$(nproc) Image.gz-dtb

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          # Faqat bitta 'Image' emas, butun 'boot' papkasini yuklaymiz (Xatolikni yo'qotadi)
          path: kernel/out/arch/arm64/boot/
