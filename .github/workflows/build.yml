name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git libssl-dev lz4

      - name: Download Google AOSP Clang
        run: |
          # Android kerneellarini xatosiz yig'ish uchun rasmiy Google kompilyatorini yuklaymiz
          mkdir -p clang
          curl -L https://googlesource.com | tar -xz -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Download Verified AtomX Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Atom-X-Devs/android_kernel_xiaomi_sm7325
          ref: kernel.lnx.5.4.r1-rel
          path: kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          else
            ALT_GPU=$(find . -name "*gpu*.dtsi" | head -n 1)
            if [ -n "$ALT_GPU" ]; then
              sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' "$ALT_GPU"
              echo "Muqobil GPU fayli patch qilindi!"
            fi
          fi

      - name: Build Verified Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Google Clang vositalarining aniq manzilini belgilaymiz
          CLANG_PREFIX=$(pwd)/../clang/bin/
          
          # Konfiguratsiya faylini generatsiya qilish
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- CROSS_COMPILE_COMPAT=${CLANG_PREFIX}arm-linux-androidkernel- LLVM=1 vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- CROSS_COMPILE_COMPAT=${CLANG_PREFIX}arm-linux-androidkernel- LLVM=1 vendor/sm7325_defconfig
          else
            make ARCH=arm64 O=out CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- CROSS_COMPILE_COMPAT=${CLANG_PREFIX}arm-linux-androidkernel- LLVM=1 gki_defconfig
          fi
          
          # Haqiqiy Google AOSP Clang vositalari yordamida kompilyatsiya qilish
          make ARCH=arm64 O=out \
            CC=${CLANG_PREFIX}clang \
            LD=${CLANG_PREFIX}ld.lld \
            AR=${CLANG_PREFIX}llvm-ar \
            NM=${CLANG_PREFIX}llvm-nm \
            OBJCOPY=${CLANG_PREFIX}llvm-objcopy \
            OBJDUMP=${CLANG_PREFIX}llvm-objdump \
            STRIP=${CLANG_PREFIX}llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc)

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
