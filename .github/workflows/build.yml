name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Clang and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev clang lld bison flex Git

      - name: Download Clean LineageOS Source
        run: |
          # Git 128 xatoligini oldini olish uchun bufer hajmini oshiramiz va single-branch orqali faqat toza kodni olamiz
          git config --global pack.windowMemory "100m"
          git config --global pack.packSizeLimit "100m"
          git config --global core.bigFileThreshold "50m"
          
          git clone https://github.com --depth=1 --single-branch -b lineage-21 kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          # LineageOS kodidagi barqaror GPU dtsi faylini topib patch qilamiz
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          else
            echo "Ogohlantirish: GPU dtsi topilmadi, muqobil yo'l tekshirilmoqda..."
          fi

      - name: Build LineageOS Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # LineageOS 21 dagi taoyao uchun rasmiy va xatosiz defconfig faylini ishga tushiramiz
          make ARCH=arm64 O=out vendor/taoyao_defconfig
          
          # Kompilyatsiya qilish (Hech qanday kirlanish xatolarisiz toza out ichida yig'iladi)
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
