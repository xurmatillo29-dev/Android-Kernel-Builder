name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Standard Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git lz4

      - name: Android Kernel Build Action
        # Google va Qualcomm yadrolari uchun maxsus yaratilgan eng mashhur va xatosiz rasmiy yig'uvchi kutubxona
        uses: dabyd64/android-kernel-actions@v1.4.1
        with:
          kernel-src: https://github.com
          kernel-branch: kernel.lnx.5.4.r1-rel
          config: taoyao_defconfig
          arch: arm64
          compiler: clang
          clang-version: r450784d # Xiaomi 12 Lite uchun Google original Clang drayveri

      - name: Patch GPU Frequency to 650MHz
        run: |
          # Bu tizim avtomat ravishda 'workspace/kernel' ichiga yuklaydi, o'sha yerdan dtsi faylini topib patch qilamiz
          GPU_FILE=$(find . -name "sm7325-gpu.dtsi" | head -n 1)
          if [ -n "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' "$GPU_FILE"
            echo "GPU 650MHz patchi Google Clang muhitida muvaffaqiyatli bajarildi."
          fi

      - name: Upload Verified Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: out/arch/arm64/boot/Image
