name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Standard Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git lz4

      - name: Download Official Google AOSP Clang
        run: |
          # Git clone orqali tar.gz xatolarini chetlab o'tib, original Google prebuilt Clang vositalarini yuklaymiz
          git clone https://googlesource.com --depth=1 -b main clang-bin
          echo "$(pwd)/clang-bin/clang-r450784d/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$(pwd)/clang-bin/clang-r450784d/bin/" >> $GITHUB_ENV

      - name: Download Verified AtomX Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Atom-X-Devs/android_kernel_xiaomi_sm7325
          ref: kernel.lnx.5.4.r1-rel
          path: kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          else
            ALT_GPU=$(find . -name "*gpu*.dtsi" | head -n 1)
            if [ -n "$ALT_GPU" ]; then
              sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' "$ALT_GPU"
              echo "Muqobil GPU fayli patch qilindi!"
            fi
          fi

      - name: Build Verified Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Google Clang original vositalari durlarini ulaymiz
          CLANG_PREFIX=${{ env.CLANG_PATH }}
          
          # Konfiguratsiya faylini aniqlash va generatsiya qilish
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out CC=${CLANG_PREFIX}clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out CC=${CLANG_PREFIX}clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- vendor/sm7325_defconfig
          else
            make ARCH=arm64 O=out CC=${CLANG_PREFIX}clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- gki_defconfig
          fi
          
          # 100% G'alaba bosqichi: Google original AOSP LLVM muhitida to'liq yig'ish
          make ARCH=arm64 O=out \
            CC=${CLANG_PREFIX}clang \
            LD=${CLANG_PREFIX}ld.lld \
            AR=${CLANG_PREFIX}llvm-ar \
            NM=${CLANG_PREFIX}llvm-nm \
            OBJCOPY=${CLANG_PREFIX}llvm-objcopy \
            OBJDUMP=${CLANG_PREFIX}llvm-objdump \
            STRIP=${CLANG_PREFIX}llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${CLANG_PREFIX}aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=${CLANG_PREFIX}arm-linux-androidkernel- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) Image.gz-dtb

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/
