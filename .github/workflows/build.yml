name: Xiaomi 12 Lite GPU Overclock & KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Cloud Kernel Compiling
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Builder
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libncurses-dev libssl-dev libxml2-utils rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lz4

    - name: Download Kernel Source via Action
      uses: actions/checkout@v4
      with:
        repository: crdroidandroid/android_kernel_xiaomi_sm7325
        ref: 14.0
        path: android_kernel

    - name: Download Clang Compiler via Action
      uses: actions/checkout@v4
      with:
        repository: google/platform-prebuilts-clang-host-linux-x86
        path: clang-aosp
        sparse-checkout: |
          clang-r487747c

    - name: Setup KernelSU & GPU 650MHz Patch
      run: |
        cd android_kernel
        curl -LSs "https://githubusercontent.com" | bash -s main
        find . -name "*gpu*.dtsi" -exec sed -i 's/qcom,gpu-freq = <550000000>/qcom,gpu-freq = <650000000>/g' {} +
        find . -name "*gpu*.dtsi" -exec sed -i 's/qcom,gpu-freq = <490000000>/qcom,gpu-freq = <650000000>/g' {} +
        find . -name "*gpu*.dtsi" -exec sed -i 's/qcom,gpu-freq = <560000000>/qcom,gpu-freq = <650000000>/g' {} +

    - name: Compile Kernel
      run: |
        cd android_kernel
        export PATH="$GITHUB_WORKSPACE/clang-aosp/clang-r487747c/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        make vendor/sm7325_defconfig
        make -j$(nproc)

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com AnyKernel3
        cp android_kernel/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r ../Xiaomi12Lite-crDroid-650MHz-KernelSU.zip *

    - name: Upload Finished Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi12Lite-crDroid-Kernel
        path: Xiaomi12Lite-crDroid-650MHz-KernelSU.zip
