name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm7325
          ref: lineage-21
          path: kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz patchi muvaffaqiyatli bajarildi."
          else
            echo "GPU dtsi fayli topilmadi!"
          fi

      - name: Set up Clang and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev clang lld bison flex

      - name: Find Defconfig and Build
        run: |
          cd kernel
          # Haqiqiy mavjud faylni avtomatik qidirish sxemasi
          CONF_FILE=$(find arch/arm64/configs/ -name "*taoyao*" -o -name "*sm7325*" -o -name "*gki*" | head -n 1)
          
          if [ -n "$CONF_FILE" ]; then
            TARGET_CONF=${CONF_FILE#arch/arm64/configs/}
            echo "Topilgan konfiguratsiya fayli: $TARGET_CONF"
            make ARCH=arm64 O=out "$TARGET_CONF"
          else
            echo "Mos keladigan defconfig topilmadi! Standart gki_defconfig ishlatiladi."
            make ARCH=arm64 O=out gki_defconfig
          fi
          
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 -j$(nproc)

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
