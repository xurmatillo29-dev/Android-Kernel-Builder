name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Standard Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git lz4

      - name: Download Official Google AOSP GCC Toolchain
        run: |
          # Yangi GCC versiyalaridagi barcha assembler (asm) xatolarini chetlab o'tish uchun Google original kompilyatorini yuklaymiz
          git clone https://googlesource.com --depth=1 gcc-aarch64
          git clone https://googlesource.com --depth=1 gcc-arm
          
          # Manzillarni global tizim o'zgaruvchisiga (Env) joylaymiz
          echo "GCC_AARCH64_PREFIX=$(pwd)/gcc-aarch64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC_ARM_PREFIX=$(pwd)/gcc-arm/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Download Verified AtomX Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Atom-X-Devs/android_kernel_xiaomi_sm7325
          ref: kernel.lnx.5.4.r1-rel
          path: kernel

      - name: Patch GPU Frequency and Fix Techpack Error
        run: |
          cd kernel
          
          # 1. Buzuq sensor va displey drayverlarini butunlay o'chiramiz
          rm -rf drivers/input/touchscreen/focaltech_3680
          sed -i '/focaltech_3680/d' drivers/input/touchscreen/Makefile
          sed -i '/focaltech_3680/d' drivers/input/touchscreen/Kconfig
          
          # 2. Xato bergan techpack displey drayverini zanjirdan uzamiz
          if [ -f "Makefile" ]; then
            sed -i 's/obj-y += techpack\/display\///g' Makefile || true
            sed -i '/techpack\/display/d' Makefile || true
          fi

          # 3. GPU chastotasini 650MHz ga patch qilamiz
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          fi

      - name: Build Verified Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Google AOSP original drayver durlarini yuklaymiz
          CROSS_A64=${{ env.GCC_AARCH64_PREFIX }}
          CROSS_A32=${{ env.GCC_ARM_PREFIX }}
          
          # Konfiguratsiya faylini generatsiya qilish (Google GCC 4.9 yordamida)
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=${CROSS_A64} CROSS_COMPILE_COMPAT=${CROSS_A32} vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=${CROSS_A64} CROSS_COMPILE_COMPAT=${CROSS_A32} vendor/sm7325_defconfig
          else
            make ARCH=arm64 O=out CROSS_COMPILE=${CROSS_A64} CROSS_COMPILE_COMPAT=${CROSS_A32} gki_defconfig
          fi
          
          # Google original kross-kompilyatori vdso va crypto ichidagi barcha assembler to'siqlarini 0 xato bilan yakunlaydi
          make ARCH=arm64 O=out \
            CROSS_COMPILE=${CROSS_A64} \
            CROSS_COMPILE_COMPAT=${CROSS_A32} \
            -j$(nproc) Image

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
