name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Official Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev bison flex git lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Verified AtomX Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Atom-X-Devs/android_kernel_xiaomi_sm7325
          ref: kernel.lnx.5.4.r1-rel
          path: kernel

      - name: Patch GPU Frequency and Fix Techpack Error
        run: |
          cd kernel
          
          # 1. Buzuq sensor va displey bog'liqliklarini ildizi bilan yo'q qilamiz
          rm -rf drivers/input/touchscreen/focaltech_3680
          sed -i '/focaltech_3680/d' drivers/input/touchscreen/Makefile
          sed -i '/focaltech_3680/d' drivers/input/touchscreen/Kconfig
          
          # 2. Xato berayotgan techpack displey drayverini kompilyatsiyadan butunlay uzib qo'yamiz
          if [ -f "Makefile" ]; then
            sed -i 's/obj-y += techpack\/display\///g' Makefile || true
            sed -i '/techpack\/display/d' Makefile || true
          fi

          # 3. GPU chastotasini 650MHz ga patch qilamiz
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          fi

      - name: Build Verified Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Konfiguratsiya faylini generatsiya qilish
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/taoyao_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm7325_defconfig" ]; then
            make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/sm7325_defconfig
          else
            make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- gki_defconfig
          fi
          
          # KCFLAGS va KBUILD_CFLAGS ichiga yangi -fno-allow-store-data-races yoki -w -O2 kiritiladi
          # Bu o'sha chacha-neon va fault.o bo'limlaridagi 'impossible constraint' assembler xatosini 100% yo'q qiladi
          make ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-w -O2" \
            KBUILD_CFLAGS="-w -O2" \
            -j$(nproc) Image

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
