name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Clang and Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libssl-dev libelf-dev clang lld bison flex git

      - name: Download Clean LineageOS Source
        uses: actions/checkout@v4
        with:
          repository: Murnovi/android_kernel_xiaomi_sm7325
          ref: lineage-21
          path: kernel

      - name: Patch GPU Frequency to 650MHz
        run: |
          cd kernel
          GPU_FILE="arch/arm64/boot/dts/vendor/qcom/sm7325-gpu.dtsi"
          if [ -f "$GPU_FILE" ]; then
            sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' $GPU_FILE
            echo "GPU 650MHz muvaffaqiyatli patch qilindi."
          else
            ALT_GPU=$(find . -name "*gpu*.dtsi" | head -n 1)
            if [ -n "$ALT_GPU" ]; then
              sed -i 's/qcom,gpu-pwrlevel@0 {/qcom,gpu-pwrlevel@0 {\n\t\t\treg = <0>;\n\t\t\tqcom,gpu-freq = <650000000>;/g' "$ALT_GPU"
              echo "Muqobil GPU fayli patch qilindi!"
            fi
          fi

      - name: Build LineageOS Kernel
        run: |
          cd kernel
          mkdir -p out
          
          # Yangi barqaror repozitoriyadagi taoyao defconfig faylini ishga tushiramiz
          if [ -f "arch/arm64/configs/vendor/taoyao_defconfig" ]; then
            make ARCH=arm64 O=out vendor/taoyao_defconfig
          else
            make ARCH=arm64 O=out taoyao_defconfig
          fi
          
          # Kompilyatsiya qilish
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-12Lite-Kernel-650MHz
          path: kernel/out/arch/arm64/boot/Image
